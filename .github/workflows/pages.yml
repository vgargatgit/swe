name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate course visual coverage
        run: |
          node tools/validate-day-01-diagram-design.mjs
          node tools/validate-course-visuals.mjs
          node tools/validate-bespoke-visuals.mjs
          for file in \
            visuals/day-01-diagram-design-core.js \
            visuals/day-01-diagram-layered.js \
            visuals/day-01-diagram-token-bucket.js \
            visuals/day-01-diagram-distributed.js \
            visuals/day-01-diagram-trusted-proxy.js \
            visuals/day-01-diagram-request.js \
            visuals/day-01.js \
            visuals/bespoke-dsl.js \
            visuals/bespoke-04-12.js \
            visuals/bespoke-13-21.js \
            visuals/bespoke-22-29.js \
            visuals/bespoke-30-36.js \
            visuals/bespoke.js \
            visuals/course.js; do
            node --check "$file"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
