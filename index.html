  <style>
    :root{--bg:#f7f8fb;--surface:#fff;--ink:#172033;--muted:#5f6b7d;--line:#dde3ec;--accent:#2f5bea;--soft:#edf2ff;--good:#146c43;--goodSoft:#eaf7f0;--quiet:#7a8495;--quietSoft:#f0f2f6;--shadow:0 10px 30px rgba(23,32,51,.08);--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at top left,rgba(47,91,234,.11),transparent 30rem),radial-gradient(circle at top right,rgba(0,168,137,.09),transparent 24rem),var(--bg);font:16px/1.68 Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.site-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px max(20px,calc((100vw - 1180px)/2));border-bottom:1px solid rgba(221,227,236,.9);background:rgba(247,248,251,.92);backdrop-filter:blur(14px)}.brand{color:var(--ink);font-weight:800;letter-spacing:-.02em}nav{display:flex;gap:18px}nav a{color:var(--muted);font-weight:700}#app{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:54px 0 80px}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1,h2,h3{color:var(--ink);line-height:1.18}h1,h2{font-family:'Source Serif 4',Georgia,serif}h1{margin:10px 0 16px;font-size:clamp(2.35rem,6vw,5.1rem);letter-spacing:-.04em}h2{margin-top:0;font-size:clamp(1.65rem,3vw,2.45rem)}h3{margin:0 0 8px;font-size:1.08rem}.lead{max-width:820px;color:var(--muted);font-size:1.1rem}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:end;margin-bottom:38px}.hero-card,.card,.panel,.diagram-card,.callout{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}.hero-card{padding:24px}.metrics{display:grid;gap:12px;margin-top:18px}.metric{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px;border-radius:14px;background:#fbfcff;border:1px solid var(--line)}.metric strong{font-size:1.35rem}.metric span{color:var(--muted)}.stage{margin:42px 0}.stage-heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:14px}.stage-heading p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;padding:22px;transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(23,32,51,.12)}.card p{margin-bottom:0;color:var(--muted)}.card a::after{content:'';position:absolute;inset:0}.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.day{color:var(--accent);font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.status-published{color:var(--good);background:var(--goodSoft)}.status-upcoming{color:var(--quiet);background:var(--quietSoft)}.upcoming{opacity:.74;box-shadow:none;background:#fbfcff}.breadcrumbs{margin-bottom:22px;color:var(--muted);font-size:.92rem}.lesson-header{margin-bottom:24px}.lesson-header h1{font-size:clamp(2.25rem,5vw,4.2rem)}.meta{display:flex;flex-wrap:wrap;gap:9px}.pill{padding:6px 11px;border-radius:999px;background:var(--soft);color:#2447b8;font-size:.83rem;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}.content{min-width:0}.panel,.diagram-card{padding:clamp(22px,4vw,36px);margin-bottom:22px;scroll-margin-top:88px}.panel p:last-child{margin-bottom:0}.panel ul{padding-left:1.4rem}.panel li{margin:.5rem 0}.callout{padding:18px 20px;box-shadow:none;background:#fbfcff;border-left:4px solid var(--accent);margin-bottom:22px}.sidebar{position:sticky;top:84px}.sidebar .card{box-shadow:none}.sidebar ul{padding-left:20px;margin-bottom:0}.sidebar li{margin:7px 0}.sidebar a{color:var(--muted);font-size:.9rem}.mermaid{display:flex;justify-content:center;overflow-x:auto;padding:14px;border-radius:14px;background:#fbfcff;border:1px solid var(--line)}.topic-list{columns:3;column-gap:28px;padding-left:20px}.topic-list li{break-inside:avoid;margin:.45rem 0}.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}.lesson-nav a{display:block;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface)}.lesson-nav a:last-child{text-align:right}.kicker{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.search-row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.search-row input{flex:1;min-width:240px;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit}.search-row button{border:0;border-radius:999px;background:var(--accent);color:white;font-weight:800;padding:12px 16px;cursor:pointer}.site-footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:24px 20px 40px}@media(max-width:930px){.hero,.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.sidebar{position:static}.topic-list{columns:2}}@media(max-width:620px){#app{width:min(100% - 24px,1180px);padding-top:30px}.site-header{padding-inline:14px;align-items:flex-start;flex-direction:column;gap:6px}nav{gap:12px;font-size:.9rem}.grid{grid-template-columns:1fr}.topic-list{columns:1}.lesson-nav{grid-template-columns:1fr}.lesson-nav a:last-child{text-align:left}}

<script>
const roadmap = ['Rate Limiting','Caching','Load Balancing','Reverse Proxies','API Gateways','CI/CD','Docker','Kubernetes','Service Discovery','Circuit Breakers','Timeouts','Retries','Exponential Backoff','Idempotency','Message Queues','Pub/Sub','Event-Driven Architecture','Distributed Transactions','Saga Pattern','Dead Letter Queues','Cron Jobs','WebSockets','Long Polling','Server-Sent Events','Database Indexing','Query Optimization','N+1 Queries','Connection Pooling','Read Replicas','Sharding','Partitioning','Replication','Leader Election','CAP Theorem','Eventual Consistency','Optimistic Locking','Pessimistic Locking','Distributed Locks','Race Conditions','Deadlocks','Memory Leaks','Garbage Collection','Thread Safety','Backpressure','Autoscaling','Horizontal Scaling','Vertical Scaling','CDN','Edge Caching','Cache Invalidation','Feature Flags','Blue-Green Deployments','Canary Releases','Rolling Deployments','Rollbacks','Health Checks','Liveness & Readiness Probes','Monitoring','Logging','Distributed Tracing','Metrics','Alerting','SLOs','SLIs','Error Budgets','Observability','Secrets Management','IAM','OAuth','JWT Rotation','TLS','Encryption at Rest','Encryption in Transit','WAF','DDoS Protection','CORS','CSRF','SQL Injection','XSS','SSRF','Database Migrations','Schema Versioning','Disaster Recovery','Backups','Failover','Multi-Region Deployments','Chaos Engineering','Cost Optimization','Cold Starts','Serverless Limits','Latency','Throughput','P99 Latency','Tail Latency','Network Partitions','Clock Skew','DNS','TCP vs UDP','HTTP/2 & HTTP/3','gRPC','Webhooks','API Versioning','Semantic Versioning','Infrastructure as Code','Terraform','Helm Charts','Build Caching','Dependency Hell','Production Incidents','On-call','Postmortems'];
const lessons = [
  ['Rate Limiting','Admission control for APIs: limit work by endpoint plus caller signal, not by IP alone.','flowchart LR\nC[Client]-->Edge[Edge/WAF]\nEdge-->App[Spring filter]\nApp-->R[(Redis/Bucket4j)]\nR--allow/deny-->App\nApp-->API[Endpoint]','Use identity/user/tenant for authenticated requests. For unauthenticated endpoints combine coarse IP, endpoint/global limits, submitted identifier hash, signed anonymous session, and signed device cookie.','NAT and forward proxies create shared-IP false positives; botnets create IP-rotation false negatives. Trust forwarded client IP only from your own sanitized proxy chain.','A strong interview answer explains token bucket vs fixed window, 429/Retry-After, edge versus app-layer limits, and limiter observability.'],
  ['Caching','Caching stores expensive results closer to callers while trading freshness for speed.','flowchart LR\nClient-->App\nApp-->Cache[(Cache)]\nCache--hit-->App\nCache--miss-->DB[(Source of truth)]\nDB-->App\nApp--populate TTL-->Cache','Use cache-aside for many backend reads: look up cache, load source on miss, populate with TTL. Keep the database authoritative.','Design for stampede, avalanche, hot keys, stale cache refill, negative caching, TTL jitter, and explicit invalidation after writes.','Explain staleness tolerance first, then Redis/Caffeine/CDN choice, invalidation strategy, failure behavior, and hit-rate/eviction metrics.'],
  ['Load Balancing','A load balancer distributes traffic across healthy backends and controls routing, health, and draining.','flowchart LR\nU[Users]-->LB[Load Balancer]\nLB-->A[App 1]\nLB-->B[App 2]\nLB-->C[App 3]\nLB-.health.->A\nLB-.health.->B\nLB-.health.->C','Layer 4 routes TCP/UDP; Layer 7 understands HTTP host, path, headers and cookies. Algorithms include round-robin, weighted, least-connections, and latency-aware routing.','Deep health checks can remove every instance when a shared dependency fails. Use readiness, liveness, and diagnostics separately.','Mention stateless apps, TLS termination, cross-AZ targets, connection draining, slow start, and safe retries only for idempotent operations.'],
  ['Reverse Proxies','A reverse proxy is the backend front door that handles transport and request mediation before the app.','flowchart LR\nClient-->CDN[CDN/WAF]\nCDN-->ALB[ALB]\nALB-->Proxy[NGINX/Envoy]\nProxy-->App[Spring/Tomcat]\nProxy-->Static[Static files]','Reverse proxies terminate TLS, rewrite URLs, forward trusted headers, compress, serve static assets, buffer slow clients, and proxy WebSockets/SSE.','Never trust X-Forwarded-For from arbitrary clients. Block origin bypass if app logic depends on edge-added headers.','Explain why NGINX can still be useful behind ALB: CORS, headers, buffering, compression, static files, custom routing, and security policy.'],
  ['API Gateways','An API gateway is the policy enforcement point for API traffic.','flowchart LR\nC[Client]-->GW[API Gateway]\nGW-->Auth[JWT/API keys]\nGW-->User[User Service]\nGW-->Order[Order Service]\nGW-->Pay[Payment Service]','Gateways centralize authentication, authorization, API keys, quotas, validation, transformation, versioning, routing, and analytics.','Do not place domain decisions such as pricing, inventory allocation, or wallet debit logic in the gateway. Services must not trust gateway-inserted identity headers unless direct access is blocked.','Contrast load balancer, reverse proxy, API gateway, and service mesh; explain north-south API policy without moving business logic to the edge.'],
  ['CI/CD','CI/CD creates a controlled path from code to production through verification, immutable artifacts, deployment, and recovery.','flowchart LR\nPR[Pull request]-->CI[Build/test/scan]\nCI-->Artifact[Immutable artifact]\nArtifact-->Stage[Staging]\nStage-->Verify[Smoke/contract]\nVerify-->Prod[Canary/blue-green]\nProd-->Observe[Post-deploy metrics]','Build once and promote the same artifact through environments. Externalize config and secrets; attach version and commit metadata.','Database changes need expand-and-contract because old and new versions coexist during rolling deployments.','Discuss PR checks, OIDC/short-lived credentials, dependency scans, contract tests, canary/blue-green deploys, rollback versus forward-fix, and business smoke metrics.'],
  ['Docker','Docker packages an app and runtime dependencies into immutable images; containers run as host-kernel processes.','flowchart TD\nDockerfile-->Image[Image layers]\nImage-->C1[Container]\nImage-->C2[Container]\nC1-->Kernel[Host kernel]\nC2-->Kernel','Use multi-stage builds, small base images, non-root users, .dockerignore, explicit tags/digests, stdout logging, health checks, and runtime config injection.','Containers are disposable. Do not store persistent data, uploads, or secrets in the image or container filesystem.','Distinguish containers from VMs, explain layers and build cache, JVM memory under cgroups, resource limits, and image scanning.'],
  ['Kubernetes','Kubernetes reconciles declared desired state across a cluster of machines.','flowchart TD\nCI[kubectl/CI]-->API[API Server]\nAPI-->etcd[(etcd)]\nAPI-->Scheduler\nScheduler-->Node1[Node]\nScheduler-->Node2[Node]\nNode1-->Pod1[Pods]\nNode2-->Pod2[Pods]','Core objects: Pod, Deployment, ReplicaSet, Service, Ingress, ConfigMap, Secret, PersistentVolume, StatefulSet, DaemonSet.','Readiness controls traffic; liveness controls restart. Do not make liveness fail because a shared downstream dependency is temporarily down.','Explain desired state, self-healing, rolling updates, resource requests/limits, probes, Services for stable networking, and stateless app design.'],
  ['Service Discovery','Service discovery maps stable logical service names to current healthy instances.','flowchart LR\nUser[User Service]-->DNS[K8s DNS]\nDNS-->Svc[ClusterIP Service]\nSvc-->P1[Payment Pod A]\nSvc-->P2[Payment Pod B]\nSvc-->P3[Payment Pod C]','Client-side discovery asks a registry for instances. Server-side discovery uses infrastructure endpoints such as Kubernetes Services.','DNS caching, stale endpoints, locality, health checks, and version-aware routing are common production concerns.','Say discovery answers who exists; load balancing answers which healthy instance receives this request.'],
  ['Circuit Breakers','A circuit breaker fails fast when recent evidence says a dependency is unhealthy.','stateDiagram-v2\n[*]-->Closed\nClosed-->Open: failures/slow calls exceed threshold\nOpen-->HalfOpen: wait expires\nHalfOpen-->Closed: probes succeed\nHalfOpen-->Open: probes fail','Closed allows calls and records outcomes; open rejects calls; half-open allows limited recovery probes.','Count infrastructure failures, not business rejections. Combine with timeouts, bulkheads, retries, and domain-safe fallbacks.','Discuss sliding windows, minimum calls, slow-call thresholds, exception classification, not-permitted calls, and fallback correctness.'],
  ['Timeouts','Timeouts define resource budgets and correctness boundaries for calls, transactions, locks, queues, and workflows.','flowchart LR\nDeadline[Request deadline]-->Pool[Pool acquire]\nPool-->Connect[Connect]\nConnect-->TLS[TLS]\nTLS-->Response[Response/read]\nResponse-->Cleanup[Cleanup margin]','Use explicit pool acquisition, connect, TLS, write, response, read/idle, and total operation timeouts. Propagate end-to-end deadlines.','A timeout means the caller stopped waiting; side-effecting operations may have unknown outcomes. Use idempotency and reconciliation.','Explain timeout budgets through a service chain, per-attempt vs total timeout, DB lock/query/transaction timeouts, and timeout classification metrics.'],
  ['Retries','Retries are safe only for transient failures when repeating the operation is safe and within budget.','flowchart TD\nFail[Failure]-->D{Deadline left?}\nD--no-->Stop[Stop]\nD--yes-->T{Transient?}\nT--no-->Stop\nT--yes-->I{Idempotent/protected?}\nI--no-->Stop\nI--yes-->Retry[Backoff then retry]','Retry ownership must be deliberate; retries at client, gateway, service, SDK, and mesh can multiply one request into many attempts.','Timeout after POST is ambiguous. For payments, retry with same idempotency key or reconcile status.','Cover retry budgets, Retry-After, first-attempt success vs final success, circuit-breaker interaction, and not retrying open-circuit exceptions.'],
  ['Exponential Backoff','Exponential backoff spaces retries out, and jitter prevents synchronized retry storms.','flowchart LR\nA1[Attempt 1]--100ms-->A2[Attempt 2]\nA2--200ms-->A3[Attempt 3]\nA3--400ms-->A4[Attempt 4]\nA4--800ms+jitter-->A5[Attempt 5]','Immediate retries overload a struggling dependency. Fixed delays move the spike. Exponential backoff reduces retry frequency during prolonged failure.','Use full jitter, equal jitter, or decorrelated jitter; always cap maximum delay and total elapsed time.','Differentiate synchronous API retries from webhook, background job, database reconnect, and WebSocket reconnect schedules.'],
  ['Idempotency','Idempotency ensures repeating one logical operation does not create duplicate effects.','sequenceDiagram\nparticipant C as Client\nparticipant S as Server\nparticipant DB as Idempotency store\nC->>S: POST /payments key K\nS->>DB: insert PENDING K\nS->>S: process\nS->>DB: store COMPLETED result\nC--xS: response lost\nC->>S: retry K\nS->>DB: find result\nS-->>C: replay','One key represents one logical operation and must be reused across retries. Store request fingerprint, status, response, creation and expiry metadata.','Insert the PENDING idempotency record before side effects. Same key with different payload should be rejected. PENDING too long may require reconciliation.','For money movement, enforce idempotency in durable business tables or ledger uniqueness, not only in a temporary cache.'],
  ['Message Queues','Queues decouple producers and consumers in time while turning overload into backlog.','flowchart LR\nP[Producer]-->Q[(Queue)]\nQ-->C1[Consumer 1]\nQ-->C2[Consumer 2]\nQ-->C3[Consumer 3]\nC1--ACK-->Q','ACK after processing gives recovery but permits duplicates, so consumers must be idempotent. Visibility timeout is a processing lease.','A queue is not infinite capacity. Monitor depth, oldest message age, publish rate, consume rate, retries, and DLQ depth.','Explain temporal decoupling, competing consumers, poison messages, visibility timeout trade-offs, ordering per entity, and transactional outbox.'],
  ['Pub/Sub','Pub/Sub fans one event out to many independent subscriber groups.','flowchart LR\nOrder[Order Service]-->Topic[(OrderCreated)]\nTopic-->Email[Email subscription]\nTopic-->Analytics[Analytics subscription]\nTopic-->Audit[Audit subscription]','Queue means someone should do this. Pub/Sub means this happened and interested systems may react. Within each subscription, workers still compete.','Each subscription has independent lag, retry, DLQ and retention. A silent subscriber can fall behind while the publisher remains healthy.','Cover topics/subscriptions, consumer groups, event ownership, event-carried state vs notification, replay, and schema governance.'],
  ['Event-Driven Architecture','EDA connects services through durable facts and asynchronous reactions.','flowchart LR\nPay[Payment Service]-->Evt[(PaymentAuthorized)]\nEvt-->Order[Order update]\nEvt-->Notify[Receipt]\nEvt-->Analytics[Conversion]\nEvt-->Search[Projection]','Events should be past-tense domain facts owned by the service that owns the state transition.','EDA reduces runtime coupling but increases event-contract responsibility: schema, ordering, delivery semantics, hidden workflows, and reconciliation.','Explain choreography vs orchestration, outbox/inbox, correlation/causation IDs, event notification vs event-carried state, and where synchronous coordination still belongs.'],
  ['Distributed Transactions','A distributed transaction attempts atomic success/failure across multiple independent resources.','sequenceDiagram\nparticipant Co as Coordinator\nparticipant A as DB A\nparticipant B as DB B\nCo->>A: prepare\nCo->>B: prepare\nA-->>Co: prepared\nB-->>Co: prepared\nCo->>A: commit\nCo->>B: commit','Local ACID is easy in one DB; remote HTTP calls and separate databases are outside one local transaction.','2PC/XA can coordinate commits but is blocking, high-latency, and hard in independently deployed microservices.','Modern systems often prefer local ACID plus outbox, inbox, idempotency, retries, reconciliation, sagas, and compensation.'],
  ['Saga Pattern','A saga breaks a distributed business transaction into local transactions and compensations.','stateDiagram-v2\n[*]-->Started\nStarted-->InventoryReserved\nInventoryReserved-->WalletDebited\nWalletDebited-->Completed\nWalletDebited-->Compensating: shipment failed\nCompensating-->WalletRefunded\nWalletRefunded-->InventoryReleased\nInventoryReleased-->Failed','Compensation is business correction, not SQL rollback. Debit/refund and reserve/release both remain in history.','Choreography distributes flow through events; orchestration centralizes a durable state machine and is often clearer for critical workflows.','Every forward and compensation command needs stable operation IDs, idempotency, timeout/reconciliation policy, and manual repair states.'],
  ['Dead Letter Queues','A DLQ quarantines messages automation could not process safely after bounded retry or permanent-failure classification.','flowchart LR\nQ[(Main queue)]-->C[Consumer]\nC--success-->Done[Done]\nC--transient-->Retry[Retry backoff]\nRetry-->Q\nC--exhausted/permanent-->DLQ[(DLQ)]\nDLQ-->Repair[Investigate repair replay]','DLQ is not a retry mechanism; it is the path after retry is exhausted or failure is permanent.','Preserve original payload plus source, offset, retry count, exception class, stack trace, schema version, consumer, and correlation ID.','Replay must be idempotent, rate-limited, observable, and owned by an operational workflow.'],
  ['Cron Jobs','Distributed cron is a scheduled workflow problem, not just code that runs at a time.','flowchart LR\nCron[Scheduler]-->Claim[Unique job claim]\nClaim-->Q[(Work queue)]\nQ-->W1[Worker]\nQ-->W2[Worker]\nW1-->CP[(Checkpoint)]','`@Scheduled` runs in every JVM replica unless guarded by leader election, distributed lock, external scheduler, or unique execution claim.','Jobs need idempotency, persisted execution state, checkpoints, overlap policy, missed schedule policy, and timezone/DST clarity.','Cron should often trigger work into a queue while workers process chunks with bounded concurrency and checkpoints.'],
  ['WebSockets','WebSockets provide a long-lived full-duplex channel after HTTP Upgrade.','flowchart LR\nA[Client A]-->LB[Load balancer]\nB[Client B]-->LB\nLB-->WS1[WS Server A]\nLB-->WS2[WS Server B]\nWS1<-->Broker[(Pub/Sub broker)]\nWS2<-->Broker','Persistent connections consume memory, file descriptors, buffers, identity state, and routing state continuously.','Cross-server delivery requires a broker because users may connect to different servers. Heartbeats detect half-open connections.','Discuss auth expiry, multiple tabs/devices, presence aggregation, reconnect storms, sticky lifetime, slow-client backpressure, durable vs ephemeral events.'],
  ['Long Polling','Long polling holds one HTTP request until an event or timeout, then the client reconnects.','sequenceDiagram\nparticipant C as Client\nparticipant S as Server\nC->>S: GET /events?after=105\nNote over S: wait asynchronously\nS-->>C: events 106..108\nC->>S: GET /events?after=108\nS-->>C: 204 timeout','Use cursors/sequences and recheck after registering waiters to avoid lost wakeups. Normal empty timeout is healthy, not an error.','Do not block one thread or hold a DB connection while waiting. Multi-node systems need a shared notification broker.','Cover active poll limits, multiple tabs, timeout alignment with proxies, 410 cursor expired, duplicate delivery, and event-delivery latency.'],
  ['Server-Sent Events','SSE is a one-way HTTP event stream from server to browser with reconnection and Last-Event-ID support.','sequenceDiagram\nparticipant B as Browser\nparticipant S as SSE Server\nB->>S: GET /events\nS-->>B: id:101 event:status data:...\nS-->>B: : heartbeat\nB--xS: disconnect\nB->>S: Last-Event-ID:101','SSE fits server-to-client notifications, job progress, dashboards, order status and AI token streaming. Client commands remain normal HTTP.','Disable proxy buffering/caching, flush events, send heartbeat comments below idle timeout, and bound per-client queues.','Mention EventSource header limitations, cookie auth, CORS, replay, at-least-once delivery, slow clients, and SSE vs WebSocket trade-offs.'],
  ['Database Indexing','Indexes are separate access structures that trade write/storage cost for faster access, ordering, joins and constraints.','flowchart TD\nQ[Query filters/order]-->IX[(B-tree index)]\nIX-->Ptr[Row pointers]\nPtr-->Table[(Table pages)]','Composite index order should follow query shape: equality predicates, then range/order columns, then included output columns when covering helps.','Indexes cost disk, memory, WAL/redo, replication, backups, migrations and every write. Too many indexes hurt write-heavy systems.','Explain selectivity, cardinality, leftmost prefix, partial/functional/covering indexes, sargability, statistics and safe production index creation.'],
  ['Query Optimization','Query optimization reduces the work needed to return the correct result.','flowchart TD\nSlow[Slow request]-->SQL[Exact SQL + params]\nSQL-->Plan[Execution plan]\nPlan-->Cause{Dominant cost}\nCause-->Rows[Too many rows]\nCause-->Join[Bad join/order]\nCause-->Sort[Sort/hash spill]\nCause-->Lock[Lock wait]','Read actual execution plans: estimated vs actual rows, loops, buffers, temp spills, and lock waits. Find where row estimates first diverge badly.','Fix predicates, projections, joins, sorts, pagination, statistics, indexes, materialization, and result size. Measure after one change.','A strong answer separates DB execution, pool wait, lock wait, network transfer, ORM mapping and response serialization.'],
  ['N+1 Queries','N+1 happens when one parent query triggers one related query per parent.','flowchart TD\nParent[Load 100 orders]-->Loop[Loop over orders]\nLoop-->Q1[items for order 1]\nLoop-->Q2[items for order 2]\nLoop-->QN[items for order 100]\nParent-->Better[Bulk fetch WHERE order_id IN (...)]','Lazy loading makes database access look like object navigation. Mappers, serializers, logging and toString can trigger hidden SQL.','Fix with fetch joins, entity graphs, batch fetching, DTO projections, or a small number of explicit bulk queries. Beware row multiplication and pagination.','Measure SQL count per endpoint and assert query budgets in tests. The goal is bounded queries and bounded data volume.'],
  ['Connection Pooling','A connection pool reuses DB sessions and limits concurrent database work.','flowchart LR\nThreads[HTTP threads]-->Pool[Pool max 20]\nPool-->DB[(Database)]\nThreads--pending waiters-->Pool\nPool-->Metrics[active idle pending hold time]','Pool size is cluster-wide: per-pod pool times max replicas plus workers, batch jobs, admin and reserves. More connections can reduce throughput.','Pool exhaustion is usually a symptom: slow queries, long transactions, external calls inside transactions, leaks, streaming results, N+1 or real capacity limits.','Explain acquisition timeout vs query timeout, maxLifetime, keepalive, leak detection, connection storms, separate OLTP/batch pools and database-side correlation.'],
  ['Read Replicas','Read replicas scale reads but may serve stale data because they trail the primary.','flowchart LR\nApp--writes/strong reads-->Primary[(Primary)]\nPrimary--async replication-->R1[(Replica A)]\nPrimary--async replication-->R2[(Replica B)]\nApp--stale-tolerant reads-->R1\nApp--reports-->R2','Classify reads by staleness tolerance: strong/current, read-your-writes, bounded stale, eventually consistent.','Post-write pinning, consistency tokens, lag-aware routing and primary fallback quotas protect correctness and primary capacity.','A SELECT is not automatically replica-safe. Balance checks, authorization, idempotency and write invariants usually belong on the primary.'],
  ['Sharding','Sharding distributes rows across independent database nodes using a shard key.','flowchart LR\nApp-->Router[Shard router]\nRouter-->S1[(Shard 1)]\nRouter-->S2[(Shard 2)]\nRouter-->S3[(Shard 3)]\nRouter-->S4[(Shard 4)]','A good shard key is available in common requests, distributes load, keeps transactions local and aligns with important invariants.','Sharding makes cross-shard joins, global uniqueness, resharding, backups, schema migrations and routing failures much harder.','Prefer logical buckets/directory indirection over naive hash modulo. Fence stale routes during migration. Measure single-shard transaction ratio.'],
  ['Partitioning','Partitioning splits one logical table into physical pieces inside one database system.','flowchart TD\nParent[(wallet_transaction)]-->P1[2026_07]\nParent-->P2[2026_08]\nParent-->P3[2026_09]\nQuery[WHERE month=2026_08]-->P2','Partition pruning eliminates irrelevant partitions. Indexes still find rows inside the partitions that remain.','Time partitions are excellent for retention, archival and maintenance; too many tiny partitions cause catalog/planning overhead.','Discuss range/list/hash partitions, local vs global indexes, uniqueness limitations, future partition automation, default partition monitoring and retention through detach/drop.'],
  ['Replication','Replication maintains multiple copies of data for availability, durability, read capacity or locality.','flowchart LR\nP[(Primary)]--WAL/binlog-->HA[(HA replica)]\nP--async-->R[(Read replica)]\nP--async x-region-->DR[(DR replica)]\nHA--promote-->NP[New primary]','Asynchronous replication is low latency but can lose acknowledged writes on failover. Synchronous replication reduces that window but increases latency and failure coupling.','Replica acknowledgement can mean received, flushed, replayed or visible. Those are different guarantees.','Explain lag, log retention/slots, failover, fencing old primary, ambiguous commit, RPO/RTO and why replicas are not backups.'],
  ['Leader Election','Leader election lets nodes agree which one currently has exclusive authority for a role.','stateDiagram-v2\n[*]-->Follower\nFollower-->Candidate: timeout\nCandidate-->Leader: majority votes\nLeader-->Follower: higher term\nLeader-->Uncertain: renewal ambiguous\nUncertain-->Follower: step down','Heartbeats suspect failure; they do not prove death. Terms/epochs give leadership generations; fencing tokens let resources reject stale leaders.','Use leader election only when singleton authority is truly needed. Queues, job claims or SKIP LOCKED often solve work ownership more simply.','Discuss quorum, randomized election timeouts, leases, GC pauses, stale leaders, split brain, and why losing lock service does not imply losing access to the protected resource.'],
  ['CAP Theorem','During network partition, a distributed system cannot guarantee both linearizable consistency and availability for every request.','flowchart TD\nP[Network partition]-->Choice{Failure policy}\nChoice-->CP[CP: reject unsafe operations]\nChoice-->AP[AP: serve locally]\nCP-->Safe[One truth preserved]\nAP-->Diverge[Temporary divergence and merge]','CAP consistency means linearizability, not ACID consistency. Availability means a non-failed node services the operation, not just returns an error.','Partition tolerance is not a feature flag. The realistic question is how each operation behaves when communication fails.','Apply per operation: wallet debits and permissions often CP; feeds, analytics, carts and notifications may be AP or eventually consistent.'],
  ['Eventual Consistency','Eventual consistency permits temporary divergence but requires a designed path to convergence and repair.','flowchart LR\nSource[(Authoritative DB)]-->Outbox[(Outbox)]\nOutbox-->Broker[(Broker)]\nBroker-->Projection[(Projection/Search)]\nSource-->Recon[Reconciliation]\nRecon-->Projection','A real design includes durable publication, idempotent consumers, event IDs, source versions, ordering strategy, DLQ handling and reconciliation.','Define freshness SLOs. Track source-to-projection latency, consumer lag, DLQ depth, version gaps and reconciliation mismatches.','Explain source of truth, read-your-writes, monotonic reads, stale caches, tombstones for deletes, replay safety and why eventual does not mean maybe.'],
  ['Optimistic Locking','Optimistic locking detects stale writes by updating only when the version read earlier is still current.','sequenceDiagram\nparticipant A as Request A\nparticipant B as Request B\nparticipant DB as Row v17\nA->>DB: read v17\nB->>DB: read v17\nA->>DB: update where version=17 -> v18\nB->>DB: update where version=17\nDB-->>B: 0 rows / conflict','It prevents lost updates. In JPA, @Version makes Hibernate include the old version in the UPDATE predicate.','Retry only if the business operation can be safely reapplied after re-reading fresh state. Do not automatically retry semantic conflicts.','Discuss REST ETag/If-Match, 409/412, bulk/native updates bypassing version, write skew limitations, high-contention retry storms and atomic SQL alternatives.']
];
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
const model=lessons.map((l,i)=>({day:i+1,title:l[0],slug:slug(l[0]),principle:l[1],diagram:l[2],sections:[['Core idea',l[1],l[3]],['Production edge cases',l[4]],['Interview reasoning',l[5]]]}));
const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const url=l=>`#/day/${String(l.day).padStart(2,'0')}-${l.slug}`;
function cards(items){return items.map(l=>`<article class='card'><div class='card-row'><span class='day'>Day ${String(l.day).padStart(2,'0')}</span><span class='status status-published'>Published</span></div><h3><a href='${url(l)}'>${esc(l.title)}</a></h3><p>${esc(l.principle)}</p></article>`).join('')}
function home(){app.innerHTML=`<section class='hero'><div><div class='eyebrow'>Practical backend / system design</div><h1>One production topic per day.</h1><p class='lead'>A field guide for backend engineers: practical patterns, edge cases, production trade-offs and interview reasoning. Mermaid diagrams replace the rough ASCII shapes from the notes.</p><div class='search-row'><input id='q' type='search' placeholder='Search lessons, e.g. retries, sharding, cache...' aria-label='Search lessons'><button id='clear'>Clear</button></div></div><aside class='hero-card'><div class='eyebrow'>Current build</div><div class='metrics'><div class='metric'><strong>${model.length}</strong><span>published day lessons</span></div><div class='metric'><strong>${roadmap.length}</strong><span>topics in the full roadmap</span></div><div class='metric'><strong>Mermaid</strong><span>flow, sequence and state diagrams</span></div></div></aside></section><section class='stage'><div class='stage-heading'><h2>Published lessons</h2><p>Start anywhere; the sequence builds from edge controls to distributed state.</p></div><div id='grid' class='grid'>${cards(model)}</div></section>`;let q=document.querySelector('#q'),g=document.querySelector('#grid');q.oninput=()=>{let s=q.value.toLowerCase().trim();g.innerHTML=cards(!s?model:model.filter(l=>(l.title+' '+l.principle+' '+l.sections.flat().join(' ')).toLowerCase().includes(s)))};document.querySelector('#clear').onclick=()=>{q.value='';g.innerHTML=cards(model);q.focus()}}
async function renderMermaid(){if(!window.mermaid)return;let nodes=[...document.querySelectorAll('.mermaid')];nodes.forEach(n=>n.removeAttribute('data-processed'));try{await window.mermaid.run({nodes})}catch(e){console.error(e)}}
function lesson(l){let prev=model.find(x=>x.day===l.day-1),next=model.find(x=>x.day===l.day+1);app.innerHTML=`<div class='breadcrumbs'><a href='#/'>Course</a> / Day ${String(l.day).padStart(2,'0')}</div><header class='lesson-header'><div class='eyebrow'>Day ${String(l.day).padStart(2,'0')}</div><h1>${esc(l.title)}</h1><p class='lead'>${esc(l.principle)}</p><div class='meta'><span class='pill'>Production patterns</span><span class='pill'>Edge cases</span><span class='pill'>Interview reasoning</span></div></header><div class='layout'><article class='content'><section class='callout'><strong>Core principle:</strong> ${esc(l.principle)}</section><section id='diagram' class='diagram-card'><h2>Visual model</h2><div class='mermaid'>${esc(l.diagram)}</div></section>${l.sections.map((s,i)=>`<section id='section-${i+1}' class='panel'><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>${s[2]?`<p>${esc(s[2])}</p>`:''}</section>`).join('')}<nav class='lesson-nav' aria-label='Lesson navigation'>${prev?`<a href='${url(prev)}'><span class='kicker'>Previous</span>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a href='${url(next)}'><span class='kicker'>Next</span>${esc(next.title)}</a>`:'<span></span>'}</nav></article><aside class='sidebar'><div class='card'><h3>On this page</h3><ul><li><a href='#diagram'>Visual model</a></li>${l.sections.map((s,i)=>`<li><a href='#section-${i+1}'>${esc(s[0])}</a></li>`).join('')}</ul></div></aside></div>`;renderMermaid()}
function roadmapPage(){app.innerHTML=`<section class='hero'><div><div class='eyebrow'>Full roadmap</div><h1>The complete sequence.</h1><p class='lead'>Published lessons are linked. Upcoming topics remain visible so the course can grow one day at a time.</p></div><aside class='hero-card'><p><strong>${model.length}</strong> published out of <strong>${roadmap.length}</strong> planned topics.</p></aside></section><ol class='topic-list'>${roadmap.map((t,i)=>{let l=model[i];return `<li>${l?`<a href='${url(l)}'>Day ${String(i+1).padStart(2,'0')}: ${esc(t)}</a>`:`<span class='status status-upcoming'>Upcoming</span> Day ${String(i+1).padStart(2,'0')}: ${esc(t)}`}</li>`}).join('')}</ol>`}
function about(){app.innerHTML=`<section class='hero'><div><div class='eyebrow'>How to use this site</div><h1>Read for production judgment.</h1><p class='lead'>Each day has a core principle, a diagram, production edge cases and interview reasoning. Use it before design reviews, incident reviews and architecture interviews.</p></div><aside class='hero-card'><h3>Study loop</h3><ol><li>Read the core principle.</li><li>Explain the diagram aloud.</li><li>Name two failure modes.</li><li>Apply it to one service you know.</li></ol></aside></section><section class='panel'><h2>Design posture</h2><p>The useful question is rarely just what a pattern is. It is where the pattern breaks, what trade-off it makes visible and which invariant it protects.</p></section>`}
function route(){let p=(location.hash||'#/').replace(/^#\/?/,'');if(!p||p==='/')return home();if(p==='roadmap')return roadmapPage();if(p==='about')return about();if(p.startsWith('day/')){let m=p.slice(4).match(/^(\d+)/);let l=m?model[Number(m[1])-1]:null;return l?lesson(l):home()}home()}
addEventListener('hashchange',route);route();
</script>
</body>
